openapi: 3.0.3
info:
  title: Order Tracking API
  version: 0.1.0
  description: Manages order creation, status lifecycle, history, and courier assignment.
servers:
  - url: /
paths:
  /orders:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    get:
      operationId: listOrders
      summary: List orders (scoped by caller's role)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          description: filter by order status
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: matching orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      summary: Manually create a new order (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid order payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not permitted to create orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/inbound:
    post:
      operationId: createInboundOrder
      summary: Create an order from the external storefront website (system-to-system)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid order payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    get:
      operationId: getOrder
      summary: Get a single order
      responses:
        '200':
          description: the order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller may not view this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}/status-history:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    get:
      operationId: listOrderStatusHistory
      summary: List the status change history for an order
      responses:
        '200':
          description: status history, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderStatusEvent' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    patch:
      operationId: updateOrderStatus
      summary: Update an order's status (staff, or courier for delivery milestones)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: order updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid or out-of-sequence status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not permitted to make this transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    post:
      operationId: cancelOrder
      summary: Cancel an order (staff)
      responses:
        '200':
          description: order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: order cannot be cancelled from its current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not permitted to cancel orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{orderId}/courier:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    patch:
      operationId: assignOrderCourier
      summary: Assign an order to a delivery courier (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId]
              properties:
                courierId: { type: string }
      responses:
        '200':
          description: order updated with assigned courier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not permitted to assign couriers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: order or courier not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /couriers:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/UserRole'
    get:
      operationId: listCouriers
      summary: List delivery couriers (staff, for assignment)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: couriers
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Courier' }
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not permitted to list couriers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    UserRole:
      name: X-User-Role
      in: header
      required: true
      description: caller role injected by the gateway from the validated token (Customer, Staff, DeliveryCourier)
      schema: { type: string }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: X-Api-Key }
  schemas:
    OrderStatus:
      type: string
      enum: [Placed, Processing, Shipped, OutForDelivery, Delivered, Cancelled]
    Order:
      type: object
      required: [id, customerId, customerEmail, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        customerEmail: { type: string, format: email }
        status: { $ref: '#/components/schemas/OrderStatus' }
        courierId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [customerEmail]
      properties:
        customerId: { type: string, description: existing customer id, if known }
        customerEmail: { type: string, format: email }
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: integer }
    OrderStatusEvent:
      type: object
      required: [id, orderId, status, changedAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        changedBy: { type: string, description: id of the staff/courier who made the change, or "system" for inbound creation }
        changedAt: { type: string, format: date-time }
    Courier:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - bearerAuth: []
